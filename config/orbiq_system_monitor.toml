# OrbIQ System Monitoring Configuration
#
# Example configuration - copy to /etc/orbiq_system_monitor/config.toml
# (or one of the other locations checked, see README) and fill in your
# own broker/username/password/device name. The __LIKE_THIS__ values are
# just placeholders marking what to fill in, not a required naming scheme.

[mqtt]
broker = "__MQTT_BROKER__"
port = 1883
username = "__MQTT_USERNAME__"
password = "__MQTT_PASSWORD__"
keep_alive_secs = 30

[device]
name = "__DEVICE_NAME__"
hw_version = "1.0"

# Update interval in seconds
update_interval_secs = 30

# Delay between discovery messages in milliseconds
discovery_delay_ms = 200
