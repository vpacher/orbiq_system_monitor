[package]
name = "orbiq_system_monitor"
version = "0.4.0"
edition = "2024"
description = "A lightweight system monitoring daemon with MQTT and Home Assistant support"

[profile.release]
strip = true

[dependencies]
tokio = { version = "1.53.1", features = ["rt", "macros", "signal"] }
rumqttc = "0.25.1"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.4"
sysinfo = "0.39.6"
serde_json = "1.0.151"
# Same version rumqttc already uses; system CA store for TLS without a ca_file.
rustls-native-certs = "0.8.4"

[package.metadata.deb]
maintainer = "Volker Pacher <volker.pacher@gmail.com>"
extended-description = """\
Publishes system metrics (CPU, memory, disks, hwmon temperatures, fans and \
currents, NVIDIA GPU, CPU frequency scaling) to an MQTT broker with Home \
Assistant auto-discovery. The package asks for the broker, credentials and \
device name on first install (debconf) and writes \
/etc/orbiq_system_monitor/config.toml; reconfigure with \
dpkg-reconfigure orbiq-system-monitor."""
license-file = ["LICENSE"]
depends = ["libc6 (>= 2.17)", "debconf (>= 0.5) | debconf-2.0"]
assets = [
    ["target/release/orbiq_system_monitor", "usr/bin/", "755"],
    # The real config is generated by postinst from the debconf answers (mode 600,
    # never overwritten on upgrade); this is only the hand-editing example.
    ["config/orbiq_system_monitor.toml", "usr/share/doc/orbiq-system-monitor/examples/config.toml", "644"]
]
maintainer-scripts = "debian"

[package.metadata.deb.systemd-units]
unit-scripts = "debian"
unit-name = "orbiq_system_monitor"
enable = false
start = false
